name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # processingClock is skipped until the near-35-day-edge workload decision is made
      # (the default workload has no copy near the edge, so that toggle can't fail yet).
      - run: pnpm torture -- --seeds 200 --p 0.05 --skip processingClock --out results/ci-torture.md --json results/ci-torture.json
